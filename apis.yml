description: 'Abby Care (Wellspring Care Inc.) is a family caregiving platform that helps families deliver
  professional care at home and get paid for it. It provides no-cost caregiver certification and CNA
  training, employment, payroll and Medicaid enrollment support, and an AI-assisted care-management
  platform (AbbyOS / AbbyAid) for real-time care documentation and insights. Backed by Khosla Ventures.
  The company operates a public marketing website but publishes no public developer API, developer
  portal, or API documentation; this profile captures the identity and domain-security posture that
  could be verified from public sources.'
